<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f5ef">
<meta name="robots" content="noindex,nofollow"><title>N5 日语小课 · 单词与语法</title>
<style>
:root{--ink:#24352d;--muted:#79867c;--green:#385d49;--pale:#e9f0e8;--orange:#e48762;--paper:#f6f5ef;--line:#e9ebe4;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 20px calc(30px + env(safe-area-inset-bottom))}.head{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 16px}.brand{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:700}.streak{border:0;background:#fff;border-radius:99px;padding:10px 13px;color:#805b3e;font-size:13px}.hero{background:var(--green);color:white;border-radius:26px;padding:24px 23px 21px;position:relative;overflow:hidden}.hero:after{content:'あ';position:absolute;right:11px;top:-35px;font-size:155px;font-weight:800;color:#ffffff0d;line-height:1}.kicker{font-size:11px;letter-spacing:.16em;color:#c9d8cb}.hero h1{font-size:30px;line-height:1.28;letter-spacing:-.03em;margin:12px 0 8px}.hero p{margin:0;color:#d3dfd5;font-size:14px;line-height:1.7}.stats{display:flex;gap:22px;margin-top:19px;font-size:12px;color:#d3dfd5}.stats b{color:white;font-size:15px;margin-right:4px}.tabs{display:flex;gap:9px;margin:21px 0 14px}.tab{flex:1;border:1px solid var(--line);background:#fff;color:#738076;padding:13px;border-radius:14px;font-weight:700}.tab.on{background:#dce9dc;color:var(--green);border-color:#dce9dc}.tools{display:flex;gap:8px;margin:14px 0 12px}.search{flex:1;min-width:0;border:1px solid var(--line);background:white;border-radius:13px;padding:12px 14px;outline:none}.search:focus{border-color:#91a996}.quiz-btn,.filter-btn{border:0;background:#fff;border-radius:13px;padding:0 13px;color:var(--green);font-weight:700;white-space:nowrap}.chips{display:flex;overflow:auto;gap:8px;padding:1px 0 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 13px;border-radius:99px;white-space:nowrap;font-size:12px}.chip.on{background:var(--ink);border-color:var(--ink);color:white}.sectionline{display:flex;justify-content:space-between;align-items:center;margin:7px 2px 11px}.sectionline strong{font-size:16px}.sectionline span{font-size:12px;color:var(--muted)}.list{display:grid;gap:10px}.card{border:1px solid var(--line);background:#fff;border-radius:17px;padding:16px;box-shadow:0 5px 18px #26382a08}.row{display:flex;align-items:center;gap:11px}.jp{font-size:25px;font-weight:750;letter-spacing:.02em}.reading{font-size:13px;color:var(--muted);margin-top:3px}.meaning{margin-left:auto;font-size:14px;font-weight:650;text-align:right}.speak,.star{border:0;background:#f2f4ef;color:var(--green);width:36px;height:36px;border-radius:12px;font-size:17px}.details{display:none;border-top:1px solid var(--line);margin-top:13px;padding-top:12px;font-size:13px;line-height:1.7;color:#68776c}.card.open .details{display:block}.example-jp{font-size:15px;color:var(--ink);margin:5px 0}.example-cn{color:var(--muted)}.meaning-lang{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:3px}.source-link{display:inline-block;margin:2px 0 8px;color:var(--green);font-size:11px;text-decoration:none}.cardbottom{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.tag{font-size:11px;background:#f2f4ef;color:#627266;border-radius:8px;padding:5px 8px}.learn{border:0;background:none;color:var(--green);font-weight:700;font-size:12px}.learn.done{color:#a0aaa1}.grammar .jp{font-size:22px;color:var(--green)}.grammar .meaning{margin:9px 0 0;text-align:left;font-size:15px}.grammar .row{align-items:flex-start}.rule{background:#f5f6f2;border-radius:11px;padding:10px 12px;color:#56665a;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:28px}.quiz{display:none;background:#fff;border-radius:21px;padding:21px;margin:12px 0;border:1px solid var(--line)}.quiz.show{display:block}.qmeta{font-size:12px;color:var(--muted)}.question{font-size:23px;font-weight:750;text-align:center;padding:25px 5px 18px}.options{display:grid;gap:9px}.option{border:1px solid var(--line);background:white;border-radius:13px;padding:13px;text-align:left;color:var(--ink)}.option.correct{border-color:#68a47b;background:#edf6ee}.option.wrong{border-color:#dc8a75;background:#fff1ed}.feedback{font-size:13px;min-height:22px;margin-top:12px;color:var(--green)}.next{display:none;width:100%;border:0;background:var(--green);color:#fff;border-radius:13px;padding:13px;margin-top:5px}.foot{text-align:center;color:#9aa39b;font-size:11px;line-height:1.7;margin:25px 7px 0}.modal-bg{display:none;position:fixed;inset:0;background:#17241dcc;z-index:3;padding:20px;align-items:center;justify-content:center}.modal-bg.show{display:flex}.modal{background:var(--paper);width:min(100%,420px);border-radius:22px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;font-weight:750}.close{border:0;background:#e8ece5;border-radius:50%;width:34px;height:34px;font-size:18px}.result{font-size:42px;text-align:center;margin:24px 0 4px;color:var(--green);font-weight:800}.result-sub{text-align:center;color:var(--muted);font-size:14px}.again{width:100%;margin-top:22px;padding:14px;border:0;border-radius:13px;background:var(--green);color:white;font-weight:700}@media(min-width:600px){.wrap{padding-top:25px}.hero{padding:30px}.hero h1{font-size:36px}}
</style>
</head>
<body><main class="wrap">
<header class="head"><div><div class="brand">JAPANESE · STEP BY STEP</div></div><button class="streak" id="streak">🌱 今日学习 0 分</button></header>
<section class="hero"><div class="kicker">はじめまして · 初次见面</div><h1>N5 日语入门<br>今天学一点。</h1><p>完整覆盖 674 个参考词条与 81 个语法点，支持搜索、分类、朗读、记忆标记和小测验。</p><div class="stats"><span><b id="learnedCount">0</b>已记住</span><span><b id="totalCount">674</b>个单词</span><span><b id="grammarCount">81</b>个语法点</span></div></section>
<nav class="tabs"><button class="tab on" data-kind="words">单词</button><button class="tab" data-kind="grammar">语法</button></nav>
<div class="tools"><input class="search" id="search" placeholder="搜索日语、假名或中文" autocomplete="off"><button class="quiz-btn" id="quizToggle">✦ 小测验</button></div>
<div class="chips" id="chips"></div>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta"></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next">下一题 →</button></section>
<div class="sectionline"><strong id="listTitle">N5 常用单词</strong><span id="shownCount"></span></div><section class="list" id="list"></section>
<footer class="foot">词表为社区整理的 N5 备考参考范围，并非 JLPT 官方公布清单。点击卡片查看例句；记忆进度保存在此设备。<br>词汇释义含中文与英文原始释义；例句与数据授权、来源见 <a href="./DATA-SOURCES.md" target="_blank">资料来源说明</a>。</footer>
</main><div class="modal-bg" id="resultModal"><div class="modal"><div class="modalhead">本轮结果<button class="close" id="closeModal">×</button></div><div class="result" id="resultScore">0/5</div><div class="result-sub">继续复习，熟悉度会慢慢增加。</div><button class="again" id="restartQuiz">再来一轮</button></div></div>
<script>
let words=[],grammar=[];
let kind='words',group='全部',query='',quizOn=false,quizItems=[],qi=0,score=0,answered=false;const $=s=>document.querySelector(s);const key='n5-safari-progress-v1';let saved=JSON.parse(localStorage.getItem(key)||'{"learned":[],"minutes":0}');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function examplesHtml(arr,withSource){return (arr||[]).map(e=>'<div class="example-jp">'+esc(e.ja)+'</div><div class="example-cn">'+esc(e.en||e.cn||'')+'</div>'+(withSource&&e.source?'<a class="source-link" href="'+esc(e.source)+'" target="_blank" rel="noopener">Tatoeba 来源 ↗</a>':'')).join('')}
const groups=()=>['全部',...new Set((kind==='words'?words:grammar).map(x=>x.group))];
function renderChips(){ $('#chips').innerHTML=groups().map(g=>`<button class="chip ${group===g?'on':''}" data-group="${g}">${g}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{group=b.dataset.group;renderChips();renderList()}) }
function renderList(){const data=kind==='words'?words:grammar;const filtered=data.filter(x=>(group==='全部'||x.group===group)&&(!query||`${x.jp} ${x.kana||''} ${x.meaning} ${x.meaningEn||''} ${x.rule||''} ${x.notes||''}`.toLowerCase().includes(query.toLowerCase())));$('#listTitle').textContent=kind==='words'?'N5 常用单词':'N5 基础语法';$('#shownCount').textContent=`${filtered.length} 条`;$('#totalCount').textContent=words.length;$('#learnedCount').textContent=saved.learned.length;$('#streak').textContent=`🌱 今日学习 ${saved.minutes} 分`;
$('#list').innerHTML=filtered.length?filtered.map((x,i)=>{const id=(kind==='words'?'w':'g')+data.indexOf(x),done=saved.learned.includes(id);return kind==='words'?`<article class="card" data-card="${id}"><div class="row"><div><div class="jp">${esc(x.jp)}</div><div class="reading">${esc(x.kana)}</div></div><div class="meaning">${esc(x.meaning)}<span class="meaning-lang">${x.meaningLang||"EN"}</span></div><button class="speak" title="朗读" data-speak="${x.jp}">🔊</button></div><div class="details"><span class="tag">英文释义参考</span><div class="example-cn">${esc(x.meaningEn)}</div><span class="tag">例句（日→英）</span>${examplesHtml(x.examples,true)}</div><div class="cardbottom"><span class="tag">${x.group}</span><button class="learn ${done?'done':''}" data-learn="${id}">${done?'✓ 已记住':'标记记住'}</button></div></article>`:`<article class="card grammar" data-card="${id}"><div class="row"><div class="jp">${x.jp}</div><button class="star" title="展开">＋</button></div><div class="meaning">${esc(x.meaning)}</div><div class="details"><div class="rule"><b>接续</b>　${x.rule}</div><div class="rule"><b>英文释义</b>　${esc(x.meaningEn||"")}</div><div class="rule"><b>提示</b>　${esc(x.notes||"注意结合语境理解。")}</div><span class="tag">例句（日→英）</span>${examplesHtml(x.examples,false)}</div><div class="cardbottom"><span class="tag">${x.group}</span><button class="learn ${done?'done':''}" data-learn="${id}">${done?'✓ 已记住':'标记记住'}</button></div></article>`}).join(''):'<div class="empty">没有找到相关内容</div>';
document.querySelectorAll('.card').forEach(c=>{c.onclick=e=>{if(e.target.closest('.learn')||e.target.closest('.speak'))return;c.classList.toggle('open')}});document.querySelectorAll('.learn').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.learn;saved.learned=saved.learned.includes(id)?saved.learned.filter(x=>x!==id):[...saved.learned,id];localStorage.setItem(key,JSON.stringify(saved));renderList()});document.querySelectorAll('.speak').forEach(b=>b.onclick=e=>{e.stopPropagation();if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(b.dataset.speak))}})
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;group='全部';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));$('#quiz').classList.remove('show');quizOn=false;renderChips();renderList()});$('#search').oninput=e=>{query=e.target.value;renderList()};$('#quizToggle').onclick=()=>{quizOn=!quizOn;$('#quiz').classList.toggle('show',quizOn);if(quizOn)startQuiz()};
function startQuiz(){quizItems=(kind==='words'?words:grammar).sort(()=>Math.random()-.5).slice(0,5);qi=0;score=0;showQ()}
function showQ(){if(qi>=quizItems.length){$('#resultScore').textContent=`${score}/${quizItems.length}`;$('#resultModal').classList.add('show');return}answered=false;const item=quizItems[qi],pool=kind==='words'?words:grammar,correct=item.meaning,others=pool.filter(x=>x!==item).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.meaning),opts=[correct,...others].sort(()=>Math.random()-.5);$('#qmeta').textContent=`第 ${qi+1} 题 / ${quizItems.length} · 选出正确意思` ;$('#question').textContent=kind==='words'?`${item.jp}　${item.kana}`:item.jp;$('#feedback').textContent='';$('#next').style.display='none';$('#options').innerHTML=opts.map(o=>`<button class="option">${esc(o)}</button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const ok=b.textContent===correct;if(ok){score++;b.classList.add('correct');$('#feedback').textContent='答对了！いいですね。'}else{b.classList.add('wrong');$('#feedback').textContent=`正确答案：${correct}`}document.querySelectorAll('.option').forEach(x=>{if(x.textContent===correct)x.classList.add('correct')});$('#next').style.display='block'})}
$('#next').onclick=()=>{qi++;showQ()};$('#closeModal').onclick=()=>{$('#resultModal').classList.remove('show')};$('#restartQuiz').onclick=()=>{$('#resultModal').classList.remove('show');startQuiz()};$('#resultModal').onclick=e=>{if(e.target.id==='resultModal')e.currentTarget.classList.remove('show')};
document.addEventListener('visibilitychange',()=>{if(document.hidden){saved.minutes+=1;localStorage.setItem(key,JSON.stringify(saved));$('#streak').textContent=`🌱 今日学习 ${saved.minutes} 分`}});async function loadStudyData(){try{const [w,g]=await Promise.all([fetch('./n5-vocab.json?rev=3').then(r=>{if(!r.ok)throw Error('词汇数据加载失败');return r.json()}),fetch('./n5-grammar.json?rev=3').then(r=>{if(!r.ok)throw Error('语法数据加载失败');return r.json()})]);words=w;grammar=g;$('#totalCount').textContent=words.length;$('#grammarCount').textContent=grammar.length;renderChips();renderList()}catch(err){$('#list').innerHTML='<div class="empty">资料暂时无法载入，请刷新页面重试。</div>';console.error(err)}}
loadStudyData();
</script></body></html>
